[package]
name = "kine-rs"
version = "0.1.0"
edition = "2021"
authors = ["Arthur & Antigravity"]
description = "High-performance 2D/3D Robotic Arm Kinematics & Inverse Kinematics Simulator in Rust (Desktop & WebAssembly)"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Arthur-911/Robo-arm"
keywords = ["robotics", "inverse-kinematics", "fabrik", "jacobian", "urdf"]
categories = ["science::robotics", "simulation", "gui", "wasm"]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.20"
eframe = { version = "0.29", default-features = false, features = [
    "default",
    "glow",
    "persistence",
] }
egui = "0.29"
web-time = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kine-sim"
path = "src/main.rs"
